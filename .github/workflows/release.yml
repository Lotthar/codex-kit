name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack
      - run: sha256sum codex-kit-*.tgz > codex-kit-*.tgz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            codex-kit-*.tgz
            codex-kit-*.tgz.sha256
